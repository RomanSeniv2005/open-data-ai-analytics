#cloud-config

package_update: true

packages:
  - git
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

write_files:
  - path: /usr/local/bin/deploy-open-data-ai.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euxo pipefail

      export DEBIAN_FRONTEND=noninteractive

      mkdir -p /etc/apt/keyrings
      rm -f /etc/apt/keyrings/docker.gpg

      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg

      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list

      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      systemctl enable docker
      systemctl start docker

      rm -rf /opt/open-data-ai-analytics
      git clone "${repo_url}" /opt/open-data-ai-analytics

      cd /opt/open-data-ai-analytics

      mkdir -p data reports plots

      docker compose -f compose.yaml up --build -d

      docker compose -f compose.yaml ps

runcmd:
  - [ bash, -lc, "/usr/local/bin/deploy-open-data-ai.sh > /var/log/open-data-ai-deploy.log 2>&1" ]

final_message: "Open Data AI Analytics deployment finished."