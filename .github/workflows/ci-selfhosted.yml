name: CI (self-hosted)

on:
  workflow_dispatch:

jobs:
  run-local-module:
    runs-on: [self-hosted]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use local venv
        run: |
          source /Users/roman/Desktop/open-data-ai-analytics/venv/bin/activate
          python --version
          pip --version

      - name: Install dependencies
        run: |
          source /Users/roman/Desktop/open-data-ai-analytics/venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run one module
        env:
          PYTHONPATH: src
        run: |
          source /Users/roman/Desktop/open-data-ai-analytics/venv/bin/activate
          mkdir -p artifacts/selfhosted
          echo "Running visualization on self-hosted runner"
          set +e
          python -m visualization > artifacts/selfhosted/run.log 2>&1
          EXIT_CODE=$?
          cat artifacts/selfhosted/run.log
          exit $EXIT_CODE

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-selfhosted
          path: artifacts/selfhosted