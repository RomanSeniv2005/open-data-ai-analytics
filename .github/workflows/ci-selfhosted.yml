name: CI (self-hosted)

on:
  workflow_dispatch:

jobs:
  run-local-module:
    runs-on: [self-hosted]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          uname -m
          which python3 || true
          python3 --version || true

      - name: Create clean CI virtual environment
        run: |
          rm -rf .ci-venv
          /usr/bin/env -u VIRTUAL_ENV python3 -m venv .ci-venv
          source .ci-venv/bin/activate
          python --version
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run visualization on self-hosted runner
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts/selfhosted
          source .ci-venv/bin/activate
          echo "Running visualization on self-hosted runner"
          set +e
          python -m visualization > artifacts/selfhosted/run.log 2>&1
          EXIT_CODE=$?
          cat artifacts/selfhosted/run.log
          exit $EXIT_CODE

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-selfhosted
          path: artifacts/selfhosted