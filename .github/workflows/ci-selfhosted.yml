name: CI (self-hosted)

on:
  workflow_dispatch:

jobs:
  run-local-module:
    runs-on: [self-hosted]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (clean env)
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pandas numpy matplotlib seaborn scikit-learn openpyxl

      - name: Run module
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts/selfhosted
          echo "Running visualization on self-hosted runner"
          python3 -m visualization > artifacts/selfhosted/run.log 2>&1
          cat artifacts/selfhosted/run.log

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-selfhosted
          path: artifacts/selfhosted